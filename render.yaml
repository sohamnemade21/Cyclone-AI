services:
  - type: web
    name: cycloneguard-ai
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: WORKERS
        value: 2
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: "*"
