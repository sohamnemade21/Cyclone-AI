name: CycloneGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r "Cyclone AI/Cyclone AI/requirements.txt" || pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        pytest -v

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t cycloneguard-ai:latest -f "Cyclone AI/Cyclone AI/Dockerfile" "Cyclone AI/Cyclone AI" || docker build -t cycloneguard-ai:latest .
